<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage links — Jepong Devxyz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg>">
<style>
*{box-sizing:border-box}
body{background:#0b1120;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 4px;display:flex;align-items:center;gap:10px}
h1 svg{width:24px;height:24px;color:#38bdf8}
h1 span{color:#38bdf8}
.sub{color:#94a3b8;font-size:13px;margin:0 0 20px}
.card{background:#111a30;border:1px solid #1e2a4a;border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-size:12px;color:#94a3b8;margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;background:#0b1120;border:1px solid #1e2a4a;border-radius:10px;color:#e2e8f0;
padding:12px;font-size:15px;margin-bottom:14px;outline:none}
input:focus{border-color:#0284c7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0284c7;color:#fff;border:0;
border-radius:12px;padding:13px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{background:#0369a1}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:12px;background:#0b1120;border:1px solid #1e2a4a;border-radius:12px;padding:12px;margin-bottom:10px}
.row .meta{flex:1;min-width:0}
.row .code{font-weight:700;color:#fbbf24;font-size:15px}
.row .url{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.iconbtn{background:transparent;border:1px solid #1e2a4a;border-radius:10px;color:#94a3b8;
width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.iconbtn:hover{color:#e2e8f0;border-color:#334155}
.iconbtn.danger:hover{color:#f87171;border-color:#7f1d1d}
.iconbtn svg{width:17px;height:17px}
.empty{text-align:center;color:#475569;font-size:14px;padding:24px 0}
.result{background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px;margin-top:14px;display:none}
.result.show{display:block}
.result .newlink{font-size:17px;font-weight:700;color:#4ade80;word-break:break-all}
.result .copyrow{display:flex;gap:10px;margin-top:10px}
.result .copyrow .btn{width:auto;flex:1;padding:10px}
.hint{font-size:12px;color:#64748b;margin-top:10px;line-height:1.6}
.brand{text-align:center;margin-top:24px;font-size:11px;color:#475569}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1e293b;
border:1px solid #334155;color:#e2e8f0;padding:12px 20px;border-radius:999px;font-size:14px;
opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;max-width:92vw;text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast small{display:block;font-size:10px;color:#64748b;margin-top:2px}
.hidden{display:none!important}
.logout{margin-top:8px;background:transparent;border:0;color:#475569;font-size:12px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1><i data-lucide="link-2"></i> Jepong <span>Devxyz</span></h1>
  <p class="sub">Create and Manage Redirect Links</p>

  <!-- Login -->
  <div class="card" id="loginCard">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" placeholder="Enter admin password" autocomplete="current-password">
    <button class="btn" id="unlockBtn"><i data-lucide="lock-open"></i> Unlock</button>
  </div>

  <!-- Main -->
  <div id="mainView" class="hidden">
    <div class="card">
      <label for="targetUrl">Target URL</label>
      <input type="url" id="targetUrl" placeholder="https://example.com/your-page" inputmode="url">
      <label for="customCode">Custom code <span style="text-transform:none;letter-spacing:0">(optional — random if left blank)</span></label>
      <input type="text" id="customCode" placeholder="my-promo" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="createBtn"><i data-lucide="plus"></i> Create link</button>
      <div class="result" id="resultBox">
        <div class="newlink" id="newLink"></div>
        <div class="copyrow">
          <button class="btn" id="copyNewBtn"><i data-lucide="copy"></i> Copy link</button>
          <button class="btn" id="openNewBtn" style="background:#0f766e"><i data-lucide="external-link"></i> Open</button>
        </div>
      </div>
      <p class="hint">Codes: 3–64 characters, letters, numbers, dash, underscore. New links work within about 30 seconds.</p>
    </div>

    <div class="card">
      <label>Your links</label>
      <div id="linkList"><div class="empty">Loading…</div></div>
    </div>
    <div style="text-align:center"><button class="logout" id="logoutBtn">Lock admin</button></div>
  </div>

  <div class="brand">Powered by Jepong Devxyz</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const host = location.origin;

function toast(msg) {
  const t = $('toast');
  t.innerHTML = msg + '<small>Powered by Jepong Devxyz</small>';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

function pw() { return sessionStorage.getItem('jl_admin_pw') || ''; }

async function api(method, body) {
  const res = await fetch('/api/admin', {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pw() },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { lock(); throw new Error('Wrong password.'); }
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

function lock() {
  sessionStorage.removeItem('jl_admin_pw');
  $('mainView').classList.add('hidden');
  $('loginCard').classList.remove('hidden');
  $('pw').value = '';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLinks() {
  const box = $('linkList');
  try {
    const { links } = await api('GET');
    const codes = Object.keys(links).sort();
    if (!codes.length) { box.innerHTML = '<div class="empty">No links yet — create your first one above.</div>'; return; }
    box.innerHTML = codes.map((code) => `
      <div class="row">
        <div class="meta">
          <div class="code">/${esc(code)}</div>
          <div class="url">${esc(links[code])}</div>
        </div>
        <button class="iconbtn" data-act="copy" data-code="${esc(code)}" title="Copy short link"><i data-lucide="copy"></i></button>
        <button class="iconbtn danger" data-act="del" data-code="${esc(code)}" title="Delete"><i data-lucide="trash-2"></i></button>
      </div>`).join('');
    lucide.createIcons();
    box.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        const code = b.dataset.code;
        if (b.dataset.act === 'copy') {
          navigator.clipboard.writeText(host + '/' + code).then(() => toast('Copied!'));
        } else if (confirm('Delete /' + code + '?')) {
          api('DELETE', { code }).then(() => { toast('Deleted.'); loadLinks(); }).catch((e) => toast(e.message));
        }
      };
    });
  } catch (e) { toast(e.message); }
}

$('unlockBtn').onclick = async () => {
  const v = $('pw').value.trim();
  if (!v) { toast('Enter the password first.'); return; }
  sessionStorage.setItem('jl_admin_pw', v);
  try {
    await api('GET');
    $('loginCard').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    lucide.createIcons();
    loadLinks();
    toast('Unlocked!');
  } catch (e) {
    sessionStorage.removeItem('jl_admin_pw');
    toast(e.message);
  }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('unlockBtn').click(); });

let lastCreated = '';
$('createBtn').onclick = async () => {
  const url = $('targetUrl').value.trim();
  const code = $('customCode').value.trim();
  if (!url) { toast('Enter a target URL first.'); return; }
  const btn = $('createBtn');
  btn.disabled = true;
  try {
    const { code: newCode } = await api('POST', { url, code: code || undefined });
    lastCreated = host + '/' + newCode;
    $('newLink').textContent = lastCreated;
    $('resultBox').classList.add('show');
    $('targetUrl').value = ''; $('customCode').value = '';
    loadLinks();
    toast('Link created!');
  } catch (e) { toast(e.message); }
  btn.disabled = false;
};

$('copyNewBtn').onclick = () => {
  if (lastCreated) navigator.clipboard.writeText(lastCreated).then(() => toast('Copied!'));
};
$('openNewBtn').onclick = () => { if (lastCreated) window.open(lastCreated, '_blank'); };
$('logoutBtn').onclick = () => { lock(); toast('Locked.'); };

// Resume session if this tab was already unlocked
if (pw()) {
  api('GET').then(() => {
    $('loginCard').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    loadLinks();
  }).catch(() => lock());
}

lucide.createIcons();
</script>
</body>
</html>
