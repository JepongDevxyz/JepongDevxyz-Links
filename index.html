<!doctype html>

<style>
*{box-sizing:border-box}
body{background:#0b1120;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#111a30;border:1px solid #1e2a4a;border-radius:20px;padding:36px 28px;max-width:440px;width:100%;text-align:center}
.icon{width:56px;height:56px;border-radius:16px;background:#0b1120;border:1px solid #1e2a4a;

.icon svg{width:28px;height:28px}
h1{font-size:24px;margin:0 0 8px}
h1 span{color:#38bdf8}
p{color:#94a3b8;font-size:14px;line-height:1.7;margin:0 0 8px}
code{background:#0b1120;border:1px solid #1e2a4a;padding:2px 10px;border-radius:8px;color:#fbbf24;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;background:#0284c7;color:#fff;border:0;border-radius:12px;
padding:12px 24px;font-size:15px;font-weight:600;text-decoration:none;margin-top:20px;cursor:pointer}
.btn:hover{background:#0369a1}
.btn svg{width:18px;height:18px}
.brand{margin-top:24px;font-size:11px;color:#475569}

</head>

<div class="card">
  <div class="icon"><i data-lucide="link-2"></i></div>

  Visit <code>jepong-devxyz.com/<em>code</em></code> and get sent straight to the target.</p>
  <a class="btn" href="/admin"><i data-lucide="settings-2"></i> Manage links</a>
  <div class="brand">Powered by Jepong Devxyz</div>
</div>
