<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jepong Devxyz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg>">
<style>
*{box-sizing:border-box}
body{background:#0b1120;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#111a30;border:1px solid #1e2a4a;border-radius:20px;padding:32px 24px;max-width:460px;width:100%;text-align:center}
.icon{width:56px;height:56px;border-radius:16px;background:#0b1120;border:1px solid #1e2a4a;
display:inline-flex;align-items:center;justify-content:center;color:#38bdf8;margin-bottom:14px}
.icon svg{width:28px;height:28px}
h1{font-size:24px;margin:0 0 6px}
h1 span{color:#38bdf8}
p{color:#94a3b8;font-size:14px;line-height:1.7;margin:0 0 16px}
label{display:block;font-size:11px;color:#94a3b8;margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px;text-align:left}
input{width:100%;background:#0b1120;border:1px solid #1e2a4a;border-radius:10px;color:#e2e8f0;
padding:12px;font-size:15px;margin-bottom:12px;outline:none;text-align:left}
input:focus{border-color:#0284c7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0284c7;color:#fff;border:0;border-radius:12px;
padding:13px 24px;font-size:15px;font-weight:600;text-decoration:none;margin-top:4px;cursor:pointer;width:100%}
.btn:hover{background:#0369a1}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
.btn.ghost{background:transparent;border:1px solid #1e2a4a;color:#94a3b8;margin-top:12px;font-size:14px;padding:11px 20px}
.btn.ghost:hover{color:#e2e8f0;border-color:#334155}
.result{background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px;margin-top:14px;display:none;text-align:center}
.result.show{display:block}
.result .newlink{font-size:16px;font-weight:700;color:#4ade80;word-break:break-all}
.result .copyrow{display:flex;gap:10px;margin-top:10px}
.result .copyrow .btn{flex:1;padding:10px;margin-top:0}
.hint{font-size:12px;color:#64748b;margin-top:12px;line-height:1.6;text-align:center}
.brand{margin-top:20px;font-size:11px;color:#475569}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1e293b;
border:1px solid #334155;color:#e2e8f0;padding:12px 20px;border-radius:999px;font-size:14px;
opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast small{display:block;font-size:10px;color:#64748b;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i data-lucide="link-2"></i></div>
  <h1>Jepong <span>Devxyz</span></h1>
  <p>Create a short link on <strong style="color:#e2e8f0">go.jepong-devxyz.com</strong> — free for everyone.</p>
  <div style="text-align:left">
    <label for="targetUrl">Target URL</label>
    <input type="url" id="targetUrl" placeholder="https://example.com/your-page" inputmode="url">
    <label for="customCode">Custom code (optional — random if left blank)</label>
    <input type="text" id="customCode" placeholder="my-link" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <button class="btn" id="createBtn"><i data-lucide="zap"></i> Create short link</button>
  <div class="result" id="resultBox">
    <div class="newlink" id="newLink"></div>
    <div class="copyrow">
      <button class="btn" id="copyBtn"><i data-lucide="copy"></i> Copy</button>
      <button class="btn" id="openBtn" style="background:#0f766e"><i data-lucide="external-link"></i> Open</button>
    </div>
  </div>
  <p class="hint">Codes: 3–64 characters, letters, numbers, dash, underscore.</p>
  <a class="btn ghost" href="/admin"><i data-lucide="settings-2"></i> Manage links</a>
  <div class="brand">Powered by Jepong Devxyz</div>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const host = location.origin;
let lastCreated = '';

function toast(msg) {
  const t = $('toast');
  t.innerHTML = msg + '<small>Powered by Jepong Devxyz</small>';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

$('createBtn').onclick = async () => {
  const url = $('targetUrl').value.trim();
  const code = $('customCode').value.trim();
  if (!url) { toast('Enter a target URL first.'); return; }
  const btn = $('createBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, code: code || undefined })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed.');
    lastCreated = host + '/' + data.code;
    $('newLink').textContent = lastCreated;
    $('resultBox').classList.add('show');
    $('targetUrl').value = ''; $('customCode').value = '';
    toast('Link created!');
  } catch (e) { toast(e.message); }
  btn.disabled = false;
};

$('copyBtn').onclick = () => {
  if (lastCreated) navigator.clipboard.writeText(lastCreated).then(() => toast('Copied!'));
};
$('openBtn').onclick = () => { if (lastCreated) window.open(lastCreated, '_blank'); };

lucide.createIcons();
</script>
</body>
</html>
